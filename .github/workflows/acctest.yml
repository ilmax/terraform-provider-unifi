name: Acceptance tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  acctest:
    # Boots a fresh UniFi OS Server console on every run: `make console-up`
    # builds the image from Ubiquiti's installer, installs UniFi Network,
    # creates the admin account and an API key, and starts the emulated device
    # fleet, with no manual steps (see test-infra/unifi/README.md).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Unit tests
        run: make test

      # The Network and OS versions come from UNIFI_API_VERSION and
      # test-infra/unifi/image/build.sh; set NETWORK_VERSION, UOS_VERSION or
      # UOS_INSTALLER_URL here to test another one.
      - name: Start the console
        run: make console-up

      - name: Acceptance tests
        run: make ci-test

      - name: Console logs
        if: failure()
        run: |
          docker ps -a
          docker logs uos-test --tail 200 || true
          docker logs uos-test-emu --tail 50 || true
