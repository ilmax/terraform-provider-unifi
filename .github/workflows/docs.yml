name: Docs

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  docs:
    # docs/ is generated by tfplugindocs (scripts/generate-docs.sh); fail when
    # the committed pages differ from what the schema, examples/ and templates/
    # produce. Fix with `make docs`.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Generate docs
        run: make docs

      - name: Check docs are up to date
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git status --porcelain -- docs
            git diff -- docs | head -80
            echo "docs/ is out of date: run \`make docs\` and commit the result." >&2
            exit 1
          fi
