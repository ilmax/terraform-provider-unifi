# Community-maintained UniFi OS Server image that flattens the official
# installer's extracted appliance rootfs into a single Docker image and
# runs systemd directly as PID 1 — no nested Podman-in-Docker layer, which
# is where our own sandbox/ hit a reproducible "Invalid argument" exec bug
# on this host. See https://github.com/toquanghieu/unifi-os-server-docker
services:
  unifi-os-server:
    image: hieutq/unifi-os-server:latest
    container_name: unifi-os-server
    restart: unless-stopped
    cgroup: host
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - FOWNER
      - CHOWN
      - SETUID
      - SETGID
      - KILL
      - SYS_CHROOT
      - SYS_PTRACE
      - SYS_RESOURCE
      - AUDIT_WRITE
      - MKNOD
      - SETPCAP
    tmpfs:
      - /run:exec
      - /run/lock
      - /tmp:exec
      - /var/lib/journal
      - /var/opt/unifi/tmp:size=64m
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - unifi_data:/unifi
      - ./fix-model-and-start.sh:/fix-model-and-start.sh:ro
    # Works around a bug in this image's own /entrypoint.sh: it never
    # writes /usr/lib/product_name or /usr/lib/app_model, which unifi-core
    # needs (via /sbin/ubnt-tools) or it crash-loops with
    # `Unsupported console model: ""`. See fix-model-and-start.sh.
    entrypoint: ["/fix-model-and-start.sh"]
    environment:
      - UOS_SYSTEM_IP=127.0.0.1
      - APP_MODEL=UOSSERVER
      - PRODUCT_NAME=UniFi OS Server
      # Network application version to pin, once booted (see
      # fix-model-and-start.sh). Matches UNIFI_API_VERSION at the repo
      # root / AGENTS.md — the version github.com/ilmax/unifi-client-go
      # generates its client from.
      - NETWORK_VERSION=${NETWORK_VERSION:-10.6.106}
    ports:
      - "11443:443"
      - "8080:8080"
      - "3478:3478/udp"
      - "10003:10003/udp"

  # Emulates a small fleet (jamesbraid/unifi-emu) so the console has adopted
  # devices to test GATEWAY-managed networks, WAN, and switch/device data
  # sources against — see "Adopted device fleet" below. Replaces the old
  # amd989/unifi-gateway single-device emulator: unifi-emu speaks the same
  # real inform protocol but resolves the controller's hostname to an IP
  # itself (no wrapper script needed — amd989/unifi-gateway rejected
  # `unifi-os-server` as a hostname and needed one), takes device MACs as
  # plain flags/env instead of a rewritten config file (no named volume or
  # container mac_address: pinning needed either), and covers current
  # gateway/switch/AP models instead of only a decade-old USG3.
  #
  # No network_mode: host (unsupported by Docker Desktop on macOS; also
  # unneeded — we don't need real interface stats, only devices that adopt
  # and report as connected).
  unifi-emu:
    image: ghcr.io/jamesbraid/unifi-emu:latest
    container_name: unifi-emu
    restart: unless-stopped
    environment:
      # One gateway, one switch, one AP. UXG is a current-generation gateway
      # (unlike UGW3, though see README — Zone Based Firewall still doesn't
      # unlock, a gap in the emulator's captured firmware capabilities, not
      # this compose file). USM8P/U7PRO are unifi-emu's own docs' example
      # switch/AP models. MAC/IP for each device are auto-derived from
      # SIM_MAC_BASE/SIM_IP_BASE (left at their defaults — these are just
      # informational fields in each device's inform payload, not addresses
      # anything needs to route to).
      - SIM_CONTROLLER=http://unifi-os-server:8080/inform
      - SIM_MODELS=UXG,USM8P,U7PRO

networks:
  default:
    # The running console (this session) predates this compose file and
    # is on a different compose project's network — see README's "Known
    # issues". Update this name if you bring the console up fresh from
    # this same file instead (then delete this whole `networks:` block
    # and just run `docker compose up -d` normally).
    external: true
    name: hieutq-uos_default

volumes:
  unifi_data:
