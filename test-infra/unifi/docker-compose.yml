# UniFi OS Server console for the acceptance tests.
#
# The image is built locally from Ubiquiti's own installer by image/build.sh
# (`make console-image`): the installer wraps a systemd-based image and
# normally drives it with Podman, and the recipe pulls that image out so it
# runs under plain Docker with Ubiquiti's own entrypoint. UniFi Network 11
# needs UniFi OS 6, which no community image ships yet.
#
# The Network application, the admin account and the API key are set up by
# `make console-up` (install-network.sh, bootstrap.sh).
#
# Versions come from environment variables:
#   UOS_VERSION / UOS_INSTALLER_URL   image/build.sh   (UniFi OS Server)
#   NETWORK_VERSION                   install-network.sh (default: UNIFI_API_VERSION)
#   UOS_IMAGE                         image tag shared by build.sh and this file
# A project name of its own, so the named volumes cannot collide with (or be
# removed together with) those of an older console set up from this directory.
name: unifi-os-test

services:
  unifi-os-server:
    image: ${UOS_IMAGE:-unifi-os-server-test:dev}
    container_name: ${UOS_CONTAINER:-uos-test}
    # systemd runs as PID 1: it needs the host cgroup namespace and a writable
    # cgroup mount.
    cgroup: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    stop_signal: SIGRTMIN+3
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Named volumes, not bind mounts: MongoDB cannot create its Unix socket
      # on a macOS bind mount.
      - uos_persistent:/persistent
      - unifi_data:/data
      - uos_lib:/var/lib/uosserver
    tmpfs:
      - /run:exec
      - /run/lock
      - /tmp:exec
      - /var/log/journal
      - /var/opt/unifi/tmp:size=64m
      - /data/unifi-core/config/http
    ports:
      - "11443:443"
      - "8080:8080"
      - "3478:3478/udp"
      - "10003:10003/udp"
    healthcheck:
      test: ["CMD", "curl", "-fks", "https://localhost/api/system"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Emulates a small fleet (jamesbraid/unifi-emu) so the console has adoptable
  # devices to test GATEWAY-managed networks, WAN, and switch/device data
  # sources against — see "Adopted device fleet" in README.md. unifi-emu speaks
  # the real inform protocol and resolves the controller's hostname itself.
  #
  # No network_mode: host (unsupported by Docker Desktop on macOS; also
  # unneeded — we only need devices that adopt and report as connected).
  unifi-emu:
    image: ghcr.io/jamesbraid/unifi-emu:${UNIFI_EMU_VERSION:-0.5.5}
    container_name: ${EMU_CONTAINER:-uos-test-emu}
    restart: unless-stopped
    depends_on:
      unifi-os-server:
        condition: service_healthy
    environment:
      # A gateway ("Gateway Lite"), a switch and an AP. unifi-emu's gateways
      # report no udapi_version.versionDetail, so adopting one makes Network 11
      # disable Zone Based Firewall for the site; `make restore-zbf` (run by
      # ci-test after adopt-fleet) puts the zones back. See README.md. MAC/IP
      # for each device are derived from SIM_MAC_BASE/SIM_IP_BASE (left at their
      # defaults — informational fields in each device's inform payload).
      - SIM_CONTROLLER=http://unifi-os-server:8080/inform
      - SIM_MODELS=UXG,USM8P,U7PRO

volumes:
  uos_persistent:
  unifi_data:
  uos_lib:
